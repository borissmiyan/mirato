<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirato</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    @keyframes mirato-float {
      0%, 100% {
        transform: translateY(0px) scale(1);
        filter: drop-shadow(0 0 25px rgba(237, 185, 0, 0.25));
      }
      50% {
        transform: translateY(-4px) scale(1.015);
        filter: drop-shadow(0 0 35px rgba(237, 185, 0, 0.45));
      }
    }
    @keyframes mirato-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
</head>

<body class="bg-stone-950 text-stone-200 antialiased overflow-hidden selection:bg-amber-500/20 selection:text-amber-300">
  <div id="root" style="background-color: #0c0a09; min-height: 100vh; min-width: 100vw;">
    <!-- Unified Zero-Flicker Preloader -->
    <div id="splash-preloader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0a09; z-index: 9999; user-select: none;">
      <!-- Warm Ambient Center Glow -->
      <div style="position: absolute; width: 480px; height: 480px; border-radius: 9999px; background: radial-gradient(circle, rgba(237, 185, 0, 0.08) 0%, rgba(12, 10, 9, 0) 70%); pointer-events: none;"></div>

      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 32px; z-index: 1;">
        <!-- Mirato Alpha Logo with Breathing Float Animation -->
        <div style="position: relative; width: 140px; height: 102px; display: flex; align-items: center; justify-content: center; animation: mirato-float 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;">
          <img src="/logo-alpha.png" alt="Mirato" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>

        <!-- Brand Name & Status -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.35em; color: #f5f5f4; text-indent: 0.35em;">
            MIRATO
          </div>
          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #a8a29e;">
            Загрузка студии...
          </div>

          <!-- Micro-Progress Bar -->
          <div style="margin-top: 6px; width: 160px; height: 2px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="position: absolute; inset-y: 0; left: 0; width: 45%; background: linear-gradient(90deg, #edb900, #fedf6e); border-radius: 9999px; box-shadow: 0 0 10px rgba(237, 185, 0, 0.6);"></div>
            <div style="position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent); animation: mirato-shimmer 1.8s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
